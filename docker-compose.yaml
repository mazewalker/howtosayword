services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: howtosayword-nginx:1.0
    container_name: howtosayword-full
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - "/home/csiszi/howtosayword/site-full:/usr/share/nginx/html:ro"
      - "/home/csiszi/howtosayword/out/us:/usr/share/nginx/html/audio/us:ro"
      - "/home/csiszi/howtosayword/out/uk:/usr/share/nginx/html/audio/uk:ro"
      - "subdata:/data/subs"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  api:
    build: .
    image: howtosayword-api:1.0
    container_name: howtosayword-api
    restart: unless-stopped
    environment:
      HTSW_BASE: "https://howtosayword.neurocircuit.xyz"
      SUB_STORE: "/data/subs/subscriptions.json"
      # rotate me if you ever suspect leak: openssl rand -hex 24
      SUB_OWNER_KEY: "a3f1c9d8e7b6450fa8c2d1e0f9b7a6c5d4e3f2a1b0c9d8e7"
    volumes:
      - "subdata:/data/subs"
      - "/home/csiszi/howtosayword/site-full:/data/site:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  subdata:
    name: howtosayword-subdata
