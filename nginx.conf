server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Canonical-host enforcement: any non-apex host (www, the old
    # *.neurocircuit.xyz subdomain, internal aliases) 301 -> https://howtosayword.com
    # with path + query preserved. Edge-level Cloudflare redirects were
    # requested 2026-09-25 but the vault CF token is DNS-scoped (no
    # redirect-rules permission); doing it at the origin covers the same
    # set and is CDN/token-plan independent.
    if ($host ~* ^(?!(howtosayword\.com|localhost|127\.0\.0\.1)$)) {
        return 301 https://howtosayword.com$request_uri;
    }

    # gzip text + small bins
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript image/svg+xml
               application/json application/xml text/xml image/x-icon;
    gzip_vary on;

    # long cache for immutable assets (audio + brand + css). Note: NO "json"
    # here — prefix locations win over regex, but keeping json out of the
    # regex lets /api/ (a prefix location) always take precedence, and
    # /words-index.json still matches because /api/ prefix doesn't cover it.
    location ~* \.(mp3|svg|png|ico|css|js|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # cached search index (served from disk)
    location = /words-index.json {
        add_header Cache-Control "public, max-age=86400";
    }

    # API passthrough (FastAPI in the api container)
    location /api/ {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream http_502 http_503 error timeout;
        proxy_read_timeout  30s;
        proxy_connect_timeout 3s;
        proxy_pass http://api:8000/;
    }

    # directory-style pages + assets
    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # /search/ -> /search/index.html
    location = /search { return 301 /search/; }

    # audio: mounted top-level (NOT under the webroot — nested ro-mountpoints
    # fail under runc). ^~ gives it priority over the \.mp3$ regex location.
    location ^~ /audio/ {
        alias /data/audio/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # real 404 (SEO-clean) for missing pages
    error_page 404 = @notfound;
    location @notfound {
        internal;
        return 404;
    }

    access_log off;
}
