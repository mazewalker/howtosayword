server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip text + small bins
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript image/svg+xml
               application/json application/xml text/xml image/x-icon;
    gzip_vary on;

    # long cache for immutable assets (audio + brand + css)
    location ~* \.(mp3|svg|png|ico|css|js|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # directory-style pages + assets
    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # real 404 (SEO-clean) for missing pages
    error_page 404 = @notfound;
    location @notfound {
        internal;
        return 404;
    }

    access_log off;
}
